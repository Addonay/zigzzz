# Builds every package and publishes a GitHub Release.
#
# Release: bump .version in build.zig.zon, commit, then
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Run it from the Actions tab ("Run workflow") for a dry run: the packages
# are built and attached to the run as an artifact, but nothing is released.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-tool-cache: true
          use-cache: false

      - name: Restore Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-release-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          # Prefer the full multi-target build over a native-only CI cache.
          # The main-branch dry run seeds a cache future tags can restore.
          restore-keys: |
            zig-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-release-${{ hashFiles('build.zig.zon') }}-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-release-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-ci-${{ hashFiles('build.zig.zon') }}-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-ci-

      - name: Cache packaging tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/zigzzz-pack/tools
          key: zigzzz-pack-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/package.sh') }}
          restore-keys: |
            zigzzz-pack-tools-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zip

      - name: Check the tag matches build.zig.zon
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",/\1/p' build.zig.zon | head -n1)"

          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.zig.zon version $version"
            exit 1
          fi

      - name: Test
        run: zig build test -Dtarget=x86_64-linux-gnu.2.31 --summary all

      - name: Build packages
        run: ./packaging/package.sh

      - name: Upload packages to the run
        uses: actions/upload-artifact@v4
        with:
          name: zigzzz-packages
          path: dist/release/*
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"

          # Re-running a tag's workflow replaces the files instead of failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* \
              --title "zigzzz ${tag#v}" \
              --notes "zigzzz ${tag#v}" \
              --verify-tag
          fi
